name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours. A run costs ~20 credits on the free Basic tier (~160/day).
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Scheduled/manual runs pull a fresh snapshot. If CMC is down or the key is missing, the
      # last committed snapshot is deployed instead, so the site never goes blank.
      - name: Refresh CMC snapshot
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          npm run snapshot
          git config user.name "parity-bot"
          git config user.email "parity-bot@users.noreply.github.com"
          git add public/data evidence
          git diff --cached --quiet || (git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)" && git push)

      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
